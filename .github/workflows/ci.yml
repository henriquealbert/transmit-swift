name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Tests/IntegrationServer/package-lock.json
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Install real AdonisJS integration server
        run: npm ci --prefix Tests/IntegrationServer --no-audit --no-fund
      - name: Tests and real server integration with coverage
        run: TRANSMIT_INTEGRATION=1 swift test --enable-code-coverage
      - name: Require 100% library coverage
        run: python3 scripts/check-coverage.py
      - name: Build for iOS 15
        run: |
          scheme="$(xcodebuild -list -json | python3 -c 'import json,sys; schemes=json.load(sys.stdin)["workspace"]["schemes"]; print("Transmit" if "Transmit" in schemes else "transmit-swift")')"
          xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ios IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO build
