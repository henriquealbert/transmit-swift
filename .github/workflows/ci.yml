name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Tests (AdonisJS ${{ matrix.adonis }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        adonis: [6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Tests/IntegrationServer/package-lock.json
            Tests/IntegrationServer/adonis6/package-lock.json
      - name: Select AdonisJS 6 fixture
        if: matrix.adonis == 6
        run: cp Tests/IntegrationServer/adonis6/package{,-lock}.json Tests/IntegrationServer/
      - name: Build
        run: swift build
      - name: Unit tests
        run: swift test
      - name: Install real AdonisJS integration server
        run: npm ci --prefix Tests/IntegrationServer --no-audit --no-fund
      - name: Tests and real server integration with coverage
        run: TRANSMIT_INTEGRATION=1 swift test --enable-code-coverage
      - name: Require 100% library coverage
        run: python3 scripts/check-coverage.py
      - name: Build for iOS 15
        run: |
          scheme="$(xcodebuild -list -json | python3 -c 'import json,sys; schemes=json.load(sys.stdin)["workspace"]["schemes"]; print("Transmit" if "Transmit" in schemes else "transmit-swift")')"
          xcodebuild -scheme "$scheme" -destination 'generic/platform=iOS' \
            -derivedDataPath .build/ios IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO build
  swift6:
    name: Swift 6 strict concurrency (AdonisJS ${{ matrix.adonis }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        adonis: [6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            Tests/IntegrationServer/package-lock.json
            Tests/IntegrationServer/adonis6/package-lock.json
      - name: Select AdonisJS 6 fixture
        if: matrix.adonis == 6
        run: cp Tests/IntegrationServer/adonis6/package{,-lock}.json Tests/IntegrationServer/
      - name: Build in Swift 6 language mode (warnings are errors)
        run: swift build -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Install real AdonisJS integration server
        run: npm ci --prefix Tests/IntegrationServer --no-audit --no-fund
      - name: Swift 6 unit and integration tests
        run: TRANSMIT_INTEGRATION=1 swift test --enable-code-coverage -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Require 100% library coverage in Swift 6
        run: python3 scripts/check-coverage.py
